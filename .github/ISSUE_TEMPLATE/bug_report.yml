name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FloatDock version
      description: Shown at the top of Settings.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: "Run winver. For example: Windows 11 24H2 (26100), or Windows 10 22H2 (19045)."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Setup.exe, Portable zip, winget, Microsoft Store, Built from source]
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Number of monitors, display scale, is the Windows taskbar replaced, dock mode (floating, reserved, auto-hide).
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: 'From %LocalAppData%\FloatDock\logs\floatdock.log (event names only, no personal data). Do not attach crash dumps publicly.'
