name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build FloatDock.slnx -c Release
      - name: Test
        run: dotnet test tests/FloatDock.Core.Tests/FloatDock.Core.Tests.csproj -c Release --no-restore
      - name: Publish
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Start the published app
        shell: pwsh
        run: ./scripts/smoke-start.ps1 -Exe artifacts/FloatDock-win-x64/FloatDock.App.exe

  # Windows Server 2022 has the Windows 10 era kernel (build 20348), the closest runner to the Windows 10 the app also supports.
  # A runner has no logged-in desktop, so this only proves that the app starts, stays alive, logs no error and exits on request.
  windows10-era:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build FloatDock.slnx -c Release
      - name: Start the app
        shell: pwsh
        run: ./scripts/smoke-start.ps1 -Exe src/FloatDock.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/FloatDock.App.exe